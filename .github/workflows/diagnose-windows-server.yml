name: Diagnose native Windows server health

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing draft source transfer tag
        required: true
        type: string
      source_sha:
        description: Encrypted source SHA-256
        required: true
        type: string
      source_commit:
        description: Exact source commit
        required: true
        type: string
      release_tag:
        description: Existing draft desktop tag
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor == 'HamzaArya'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Restore authenticated source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARYA_BUILD_SOURCE_KEY: ${{ secrets.ARYA_BUILD_SOURCE_KEY }}
        run: node .github/scripts/prepare-source.mjs
      - name: Diagnose bounded server health test
        shell: pwsh
        run: node .github/scripts/diagnose-windows-server.mjs
      - name: Retain logs only on protected source draft
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/retain-private-windows-diagnostics.mjs
      - name: Remove restored source
        if: always()
        shell: pwsh
        run: |
          if ($env:ARYA_SOURCE_DIR -and (Test-Path -LiteralPath $env:ARYA_SOURCE_DIR)) {
            Remove-Item -LiteralPath $env:ARYA_SOURCE_DIR -Recurse -Force
          }
