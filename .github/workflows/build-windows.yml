name: Build Windows desktop

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Draft transfer release containing arya-source.bundle.enc
        required: true
        type: string
      source_sha:
        description: SHA-256 of the encrypted source bundle
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit
        required: true
        type: string
      release_tag:
        description: Existing draft release for verified desktop assets
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: arya-windows-desktop
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Restore authenticated encrypted source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARYA_BUILD_SOURCE_KEY: ${{ secrets.ARYA_BUILD_SOURCE_KEY }}
        run: node .github/scripts/prepare-source.mjs
      - name: Install locked application dependencies
        shell: pwsh
        run: node .github/scripts/build-source.mjs install
      - name: Check application sources and tests
        shell: pwsh
        run: node .github/scripts/build-source.mjs check
      - name: Fetch pinned native build tools
        shell: pwsh
        run: node .github/scripts/build-source.mjs tools
      - name: Fetch pinned editor source
        shell: pwsh
        run: node .github/scripts/build-source.mjs editor-source
      - name: Prepare editor dependencies
        shell: pwsh
        run: node .github/scripts/build-source.mjs editor-setup
      - name: Compile editor engine
        shell: pwsh
        run: node .github/scripts/build-source.mjs editor-compile
      - name: Assemble and verify Windows desktop package
        shell: pwsh
        run: node .github/scripts/build-source.mjs desktop-package
      - name: Upload verified package to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-package.mjs
      - name: Retain encrypted failure diagnostics
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARYA_BUILD_SOURCE_KEY: ${{ secrets.ARYA_BUILD_SOURCE_KEY }}
        run: node .github/scripts/retain-diagnostics.mjs
      - name: Remove restored source
        if: always()
        shell: pwsh
        run: |
          if ($env:ARYA_SOURCE_DIR -and (Test-Path -LiteralPath $env:ARYA_SOURCE_DIR)) {
            Remove-Item -LiteralPath $env:ARYA_SOURCE_DIR -Recurse -Force
          }
